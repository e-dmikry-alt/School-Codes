<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <title>Skjema</title>
</head>

<body>

<h1>Arbeidsoppgåve til HTML / Webdesign<br>Skuleoppgåve</h1>


<form>

<table border="1">

    <tr>
        <td>Fornavn:</td>
        <td><input type="text" name="fornavn"></td>
    </tr>

    <tr>
        <td>Etternavn:</td>
        <td><input type="text" name="etternavn"></td>
    </tr>

    <tr>
        <td>Adresse:</td>
        <td><input type="text" name="adresse"></td>
    </tr>

    <tr>
        <td>Postnr:</td>
        <td><input type="text" name="postnr"></td>
    </tr>

    <tr>
        <td>Poststed:</td>
        <td><input type="text" name="poststed"></td>
    </tr>

    <tr>
        <td>Telefon:</td>
        <td><input type="text" name="telefon"></td>
    </tr>

    <tr>
        <td>E-mail:</td>
        <td><input type="email" name="email"></td>
    </tr>

    <tr>
        <td>Kommentar:</td>
        <td>
            <textarea rows="7" cols="35"
            placeholder="Har du kommentarer?"></textarea>
        </td>
    </tr>

    <tr>
        <td>Interesser:</td>
        <td>
            <input type="checkbox"> Hester
            <input type="checkbox"> Hunder<br>

            <input type="checkbox"> Katter
            <input type="checkbox"> Blomster<br>

            <input type="checkbox"> Bier
            <input type="checkbox"> Sykler<br>

            <input type="checkbox"> Biler
            <input type="checkbox"> Båter<br>

            <input type="checkbox"> Tog
            <input type="checkbox"> Fly
        </td>
    </tr>

    <tr>
        <td>Alder:</td>
        <td>
            <input type="radio" name="alder"> 1-10
            <input type="radio" name="alder"> 11-20<br>

            <input type="radio" name="alder"> 21-30
            <input type="radio" name="alder"> 31-40<br>

            <input type="radio" name="alder"> 41-50
            <input type="radio" name="alder"> 51-99
        </td>
    </tr>

    <tr>
        <td>Legg ved fil:</td>
        <td><input type="file"></td>
    </tr>

    <tr>
        <td>Favorittmat:</td>
        <td>
            <select>
                <option>Spaghetti</option>
                <option>Pizza</option>
                <option>Taco</option>
                <option>Hamburger</option>
            </select>
        </td>
    </tr>

    <tr>
        <td></td>
        <td>
            <input type="submit" value="Send inn skjema">
            <input type="reset" value="Tilbakestill skjema">
        </td>
    </tr>

</table>

</form>

</body>
</html>

    </table>


    </Form>

</body>
</html>
